services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Where SentinelFlow stores incidents, evidence and deploy history.
      SENTINELFLOW_DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelflow
      # The database being monitored. In this demo it is the same instance.
      SENTINELFLOW_TARGET_DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelflow
      # Optional LLM stage; leave the key empty to run fully deterministically.
      SENTINELFLOW_LLM_API_KEY: ${SENTINELFLOW_LLM_API_KEY:-}
      SENTINELFLOW_LLM_BASE_URL: ${SENTINELFLOW_LLM_BASE_URL:-https://api.openai.com/v1}
      SENTINELFLOW_LLM_MODEL: ${SENTINELFLOW_LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"

volumes:
  pgdata:
